# ──────────────────────────────────────────────────────────────
# 360 PME Commerce — Base Configuration (all environments)
# Profile activation: SPRING_PROFILES_ACTIVE=dev|test|prod
# ──────────────────────────────────────────────────────────────

spring:
  application:
    name: ecom360-api

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  servlet:
    multipart:
      max-file-size: 8MB
      max-request-size: 10MB

  # ── Jackson ──
  jackson:
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      fail-on-unknown-properties: false
    default-property-inclusion: non_null
    time-zone: UTC

  # ── Async task execution ──
  task:
    execution:
      pool:
        core-size: ${ASYNC_CORE_SIZE:4}
        max-size: ${ASYNC_MAX_SIZE:16}
        queue-capacity: ${ASYNC_QUEUE_CAPACITY:200}
      thread-name-prefix: ecom360-async-

  # ── Cache ──
  cache:
    type: caffeine
    caffeine:
      spec: maximumSize=500,expireAfterWrite=600s

# ── Server ──
server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  error:
    include-message: always
    include-binding-errors: always
    include-stacktrace: never
  tomcat:
    threads:
      min-spare: ${TOMCAT_MIN_THREADS:10}
      max: ${TOMCAT_MAX_THREADS:200}
    accept-count: ${TOMCAT_ACCEPT_COUNT:100}
    max-connections: ${TOMCAT_MAX_CONNECTIONS:8192}
    connection-timeout: ${TOMCAT_CONNECTION_TIMEOUT:20000}
    keep-alive-timeout: ${TOMCAT_KEEP_ALIVE_TIMEOUT:30000}

  # ── Graceful shutdown ──
  lifecycle:
    timeout-per-shutdown-phase: 30s

# ── JWT ──
jwt:
  secret: ${JWT_SECRET:your-256-bit-secret-key-for-jwt-signing-change-in-production-min-32-chars}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:604800000}

# ── API ──
api:
  version: v1
  base-path: /api/${api.version}
  pagination:
    default-size: 20
    max-size: 100

# ── Logging (base — overridden per-profile) ──
logging:
  level:
    root: INFO
    com.ecom360: INFO
    org.springframework.security: WARN
    org.hibernate.SQL: WARN
    org.hibernate.stat: WARN
    org.flywaydb: INFO
