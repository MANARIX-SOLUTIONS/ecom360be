# ──────────────────────────────────────────────────────────────
# CD — Build boot JAR → SCP to VPS → systemd restart
# Repo: ecom360be (API). Independent from ecom360fe.
# ──────────────────────────────────────────────────────────────
name: CD

on:
  push:
    branches: [develop, main]
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        required: true
        type: choice
        options: [staging, production]
      action:
        description: install = deposit new JAR; rollback = restore previous JAR
        required: true
        type: choice
        default: install
        options: [install, rollback]

concurrency:
  group: cd-${{ github.event_name == 'workflow_dispatch' && inputs.environment || github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  JAVA_VERSION: "17"
  GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.parallel=true"

jobs:
  build-jar:
    name: Build boot JAR
    if: github.event_name != 'workflow_dispatch' || inputs.action == 'install'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build boot JAR
        run: ./gradlew bootJar --no-daemon -x test

      - name: Prepare deploy artifact
        run: |
          test -f build/libs/ecom360be.jar
          mkdir -p dist
          cp build/libs/ecom360be.jar dist/app.jar

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: app-jar
          path: dist/app.jar
          retention-days: 14

  deploy-staging:
    name: Deploy → Staging
    needs: [build-jar]
    if: |
      always() && !cancelled() &&
      (
        (needs.build-jar.result == 'success' && (
          (github.event_name == 'push' && github.ref == 'refs/heads/develop') ||
          (github.event_name == 'workflow_dispatch' && inputs.environment == 'staging' && inputs.action == 'install')
        )) ||
        (needs.build-jar.result == 'skipped' && github.event_name == 'workflow_dispatch' && inputs.environment == 'staging' && inputs.action == 'rollback')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: staging
      url: ${{ vars.STAGING_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download JAR
        if: inputs.action != 'rollback'
        uses: actions/download-artifact@v4
        with:
          name: app-jar
          path: dist

      - name: Deploy JAR over SSH
        env:
          DEPLOY_HOST: ${{ secrets.STAGING_HOST }}
          DEPLOY_USER: ${{ secrets.STAGING_USER }}
          DEPLOY_KEY: ${{ secrets.STAGING_SSH_KEY }}
          DEPLOY_PORT: ${{ vars.STAGING_SSH_PORT || '22' }}
          DEPLOY_DIR: ${{ vars.STAGING_DEPLOY_DIR || '/opt/ecom360pme' }}
          SERVICE_NAME: ${{ vars.STAGING_SERVICE_NAME || 'ecom360pme' }}
          HEALTH_URL: ${{ vars.STAGING_HEALTH_URL || 'http://127.0.0.1:8081/actuator/health/liveness' }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.STAGING_SSH_KNOWN_HOSTS }}
          LOCAL_JAR: dist/app.jar
          ACTION: ${{ inputs.action || 'install' }}
        run: |
          chmod +x scripts/ci-deploy-jar.sh scripts/remote-install-jar.sh
          scripts/ci-deploy-jar.sh

      - name: Public health check
        if: vars.STAGING_URL != ''
        run: |
          echo "Checking ${{ vars.STAGING_URL }}/actuator/health ..."
          for i in $(seq 1 20); do
            if curl -sf "${{ vars.STAGING_URL }}/actuator/health" >/dev/null 2>&1; then
              echo "Staging public URL is healthy"
              exit 0
            fi
            sleep 3
          done
          echo "Public health check failed (Nginx may not expose /actuator). SSH liveness already passed."

      - name: Deployment summary
        run: |
          {
            echo "### Staging deployment"
            echo "**Action:** \`${{ inputs.action || 'install' }}\`"
            echo "**Commit:** \`${{ github.sha }}\`"
            echo "**URL:** ${{ vars.STAGING_URL }}"
          } >> "$GITHUB_STEP_SUMMARY"

  deploy-production:
    name: Deploy → Production
    needs: [build-jar]
    if: |
      always() && !cancelled() &&
      (
        (needs.build-jar.result == 'success' &&
          github.event_name == 'workflow_dispatch' && inputs.environment == 'production' && inputs.action == 'install'
        ) ||
        (needs.build-jar.result == 'skipped' && github.event_name == 'workflow_dispatch' && inputs.environment == 'production' && inputs.action == 'rollback')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: ${{ vars.PRODUCTION_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download JAR
        if: inputs.action != 'rollback'
        uses: actions/download-artifact@v4
        with:
          name: app-jar
          path: dist

      - name: Deploy JAR over SSH
        env:
          DEPLOY_HOST: ${{ secrets.PRODUCTION_HOST }}
          DEPLOY_USER: ${{ secrets.PRODUCTION_USER }}
          DEPLOY_KEY: ${{ secrets.PRODUCTION_SSH_KEY }}
          DEPLOY_PORT: ${{ vars.PRODUCTION_SSH_PORT || '22' }}
          DEPLOY_DIR: ${{ vars.PRODUCTION_DEPLOY_DIR || '/opt/ecom360pme' }}
          SERVICE_NAME: ${{ vars.PRODUCTION_SERVICE_NAME || 'ecom360pme' }}
          HEALTH_URL: ${{ vars.PRODUCTION_HEALTH_URL || 'http://127.0.0.1:8081/actuator/health/liveness' }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.PRODUCTION_SSH_KNOWN_HOSTS }}
          LOCAL_JAR: dist/app.jar
          ACTION: ${{ inputs.action || 'install' }}
        run: |
          chmod +x scripts/ci-deploy-jar.sh scripts/remote-install-jar.sh
          scripts/ci-deploy-jar.sh

      - name: Public health check
        if: vars.PRODUCTION_URL != ''
        run: |
          echo "Checking ${{ vars.PRODUCTION_URL }}/actuator/health ..."
          for i in $(seq 1 20); do
            if curl -sf "${{ vars.PRODUCTION_URL }}/actuator/health" >/dev/null 2>&1; then
              echo "Production public URL is healthy"
              exit 0
            fi
            sleep 3
          done
          echo "Public health check failed (Nginx may not expose /actuator). SSH liveness already passed."

      - name: Deployment summary
        run: |
          {
            echo "### Production deployment"
            echo "**Action:** \`${{ inputs.action || 'install' }}\`"
            echo "**Commit:** \`${{ github.sha }}\`"
            echo "**URL:** ${{ vars.PRODUCTION_URL }}"
          } >> "$GITHUB_STEP_SUMMARY"
